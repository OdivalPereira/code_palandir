    </linearGradient>
    <linearGradient id="goldHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.45"/>
