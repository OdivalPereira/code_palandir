  <text x="28" y="658" fill="#d6d3d1" font-family="monospace" font-size="7.8">Escala: papel=coordenador, plataforma=Antigravity, modelo=...</text>
  <text x="28" y="671" fill="#d6d3d1" font-family="monospace" font-size="7.8">Assumir: sc.py assumir coordenador --etapa e3-carrinho ...</text>
  <text x="28" y="684" fill="#a7f3d0" font-family="monospace" font-size="7.8">Ação: leia a ordem da etapa (sociedade/ordens/e3-carrinho.md).</text>

