  <rect x="22" y="550" width="152" height="28" rx="5" fill="#292524" stroke="#57534e"/>
  <text x="30" y="568" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5">Projeto: loja-exemplo ▾</text>
  <rect x="184" y="550" width="154" height="28" rx="5" fill="#292524" stroke="#57534e"/>
  <text x="192" y="568" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5">Etapa: e3-carrinho ▾</text>

  <rect x="22" y="584" width="152" height="28" rx="5" fill="#292524" stroke="#57534e"/>
