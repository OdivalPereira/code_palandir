  <text x="281" y="466" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">AGY 3.3.0 ! (mod)</text>
  <text x="24" y="494" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">Projetos: Loja 3.4.0 ✓ · App Receitas 3.1.0 (defasado !) · Diário: desconhecido ?</text>

