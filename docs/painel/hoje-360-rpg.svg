  <rect x="12" y="64" width="336" height="218" rx="8" fill="#1c1917" stroke="#b45309" stroke-width="1.2"/>
  <rect x="12" y="64" width="336" height="30" rx="8" fill="url(#goldHeader)"/>
  <!-- Cantoneiras RPG discretas -->
  <path d="M12 72 L12 64 L20 64" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M348 72 L348 64 L340 64" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="24" y="84" fill="#fef3c7" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="0.5">I. ESPERA PELO CONSELHO (5)</text>

  <!-- Item 1: aprovar_ordem -->
  <rect x="22" y="102" width="316" height="38" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1"/>
  <rect x="28" y="109" width="76" height="16" rx="4" fill="#78350f"/>
  <text x="66" y="120" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">APROVAR ORDEM</text>
  <text x="112" y="120" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="10" font-weight="600">App Receitas · r1-busca</text>
  <text x="28" y="134" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">Ordem r1-busca escrita pelo Círdan; falta aprovação</text>

