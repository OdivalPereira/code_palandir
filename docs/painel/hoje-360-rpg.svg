  <text x="303" y="309" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">NUNCA EM DIA</text>

  <text x="24" y="334" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">? Diário de Campo (3 diagnósticos — estado desconhecido)</text>
  <text x="28" y="350" fill="#d6d3d1" font-family="monospace" font-size="9">• nucleo: AGENTS.md sem o bloco da Sociedade</text>
