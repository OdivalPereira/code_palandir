<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 820" width="360" height="820" role="img" aria-label="Tela Projetos em 360px no clima RPG da Terra-média">
  <defs>
    <linearGradient id="bgNightP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="goldHeaderP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="360" height="820" fill="url(#bgNightP)"/>

  <!-- TopBar RPG -->
  <rect x="0" y="0" width="360" height="52" fill="#141210" stroke="#78350f" stroke-width="1"/>
  <text x="16" y="24" fill="#fef3c7" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="0.8">MAPA DE REGIÕES · PROJETOS</text>
  <text x="16" y="38" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">3 regiões registradas · 1 em névoa (desconhecido)</text>
  <rect x="242" y="14" width="106" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="295" y="29" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Dados de exemplo</text>

  <!-- Seletor rápido de Regiões (Lista no topo em 360px) -->
  <rect x="12" y="62" width="336" height="104" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1"/>
  <!-- Região 1 (Selecionada): Loja Exemplo -->
  <rect x="20" y="70" width="320" height="28" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="28" y="88" fill="#fef3c7" font-family="Georgia, serif" font-size="10.5" font-weight="bold">▸ Loja Exemplo</text>
  <text x="148" y="88" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9">núcleo 3.4.0 · Estação: Revisão</text>
  <rect x="292" y="75" width="42" height="18" rx="9" fill="#b45309"/>
  <text x="313" y="87" text-anchor="middle" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">3 pend</text>

  <!-- Região 2: App Receitas -->
  <rect x="20" y="102" width="320" height="26" rx="5" fill="#292524" stroke="#44403c"/>
  <text x="28" y="119" fill="#e7e5e4" font-family="Georgia, serif" font-size="10">App Receitas</text>
  <text x="148" y="119" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9">núcleo 3.1.0 ! · Estação: Ordem</text>
  <rect x="292" y="106" width="42" height="18" rx="9" fill="#44403c"/>
  <text x="313" y="118" text-anchor="middle" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="8.5">2 pend</text>

  <!-- Região 3: Diário de Campo (Desconhecido D08) -->
  <rect x="20" y="132" width="320" height="26" rx="5" fill="#2e1065" stroke="#9333ea"/>
  <text x="28" y="149" fill="#f3e8ff" font-family="Georgia, serif" font-size="10" font-weight="bold">? Diário de Campo</text>
  <text x="148" y="149" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="9">núcleo: desconhecido · 3 diag.</text>
  <rect x="284" y="136" width="50" height="18" rx="9" fill="#581c87"/>
  <text x="309" y="148" text-anchor="middle" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">névoa ?</text>

  <!-- Detalhe da Região Selecionada: Loja Exemplo -->
  <!-- 1. Marcos da Jornada (Etapa e3-carrinho: 6 estações) -->
  <rect x="12" y="176" width="336" height="122" rx="8" fill="#1c1917" stroke="#d97706" stroke-width="1.2"/>
  <rect x="12" y="176" width="336" height="26" rx="8" fill="url(#goldHeaderP)"/>
