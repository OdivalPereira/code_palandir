  <!-- Linha dos 6 marcos -->
  <line x1="38" y1="224" x2="322" y2="224" stroke="#57534e" stroke-width="2"/>
  <line x1="38" y1="224" x2="265" y2="224" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Marco 1: Pedido -->
  <circle cx="38" cy="224" r="8" fill="#10b981" stroke="#064e3b" stroke-width="1.5"/>
  <text x="38" y="244" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">1.Pedido</text>
  <!-- Marco 2: Ordem -->
  <circle cx="95" cy="224" r="8" fill="#10b981" stroke="#064e3b" stroke-width="1.5"/>
  <text x="95" y="244" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">2.Ordem</text>
  <!-- Marco 3: Execução -->
  <circle cx="152" cy="224" r="8" fill="#10b981" stroke="#064e3b" stroke-width="1.5"/>
  <text x="152" y="244" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">3.Exec</text>
  <!-- Marco 4: Conferência -->
  <circle cx="208" cy="224" r="8" fill="#10b981" stroke="#064e3b" stroke-width="1.5"/>
  <text x="208" y="244" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">4.Conf</text>
  <!-- Marco 5: Revisão (Ativo com halo dourado) -->
  <circle cx="265" cy="224" r="11" fill="#f59e0b" stroke="#fef3c7" stroke-width="2"/>
  <text x="265" y="246" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">5.Revisão</text>
  <!-- Marco 6: Decisão -->
  <circle cx="322" cy="224" r="8" fill="#292524" stroke="#78716c" stroke-width="1.5"/>
  <text x="322" y="244" text-anchor="middle" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8">6.Decisão</text>

