  <text x="28" y="393" fill="#fcd34d" font-family="monospace" font-size="8">/home/dono/Projetos/loja-exemplo-codex</text>

  <rect x="22" y="401" width="316" height="30" rx="5" fill="#292524"/>
  <text x="28" y="415" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">[antigravity · worktree] etapa/e3-carrinho @ 1a2b3c4 · limpa ✓</text>
  <text x="28" y="427" fill="#a8a29e" font-family="monospace" font-size="8">/home/dono/.sociedade/trabalho/loja-exemplo/e3-carrinho</text>

