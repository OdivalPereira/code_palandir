  <text x="28" y="559" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Revisor · Codex · GPT-6.1-Sol (xhigh)</text>
  <text x="28" y="572" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">! modelo_no_log: desconhecido (null)</text>
  <text x="28" y="583" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="8">Aviso: modelo do log ainda não lido: conversa em andamento</text>

