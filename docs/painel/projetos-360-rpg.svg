  <text x="226" y="790" text-anchor="middle" fill="#a8a29e" font-family="Georgia, serif" font-size="10.5">Palantír</text>
  <text x="226" y="804" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="8.5">Analisador</text>

