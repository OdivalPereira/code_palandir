  <text x="210" y="650" fill="#a8a29e" font-family="monospace" font-size="8.5">22/10 18:20Z</text>
  <text x="32" y="667" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9">Toque para desenrolar o pergaminho (bloco recolhido)</text>

  <!-- Passagem 2 recolhida (botão >= 44px) -->
  <rect x="22" y="686" width="316" height="48" rx="6" fill="#292524" stroke="#57534e"/>
  <text x="32" y="706" fill="#fde68a" font-family="Georgia, serif" font-size="10" font-weight="bold">▸ arquiteto → revisor</text>
  <text x="210" y="706" fill="#a8a29e" font-family="monospace" font-size="8.5">23/10 09:50Z</text>
  <text x="32" y="723" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9">Toque para desenrolar o pergaminho (bloco recolhido)</text>

  <!-- Barra de Navegação Inferior (56px) -->
  <rect x="0" y="764" width="360" height="56" fill="#141210" stroke="#78350f" stroke-width="1"/>
  <rect x="10" y="770" width="80" height="44" rx="6" fill="transparent"/>
  <text x="50" y="790" text-anchor="middle" fill="#a8a29e" font-family="Georgia, serif" font-size="10.5">Conselho</text>
  <text x="50" y="804" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="8.5">Hoje (5)</text>

  <rect x="98" y="770" width="80" height="44" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="138" y="790" text-anchor="middle" fill="#fde68a" font-family="Georgia, serif" font-size="10.5" font-weight="bold">Regiões</text>
  <text x="138" y="804" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="8.5">Projetos (3)</text>

