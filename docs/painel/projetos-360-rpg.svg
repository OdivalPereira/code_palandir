  <rect x="12" y="446" width="336" height="148" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1"/>
  <text x="24" y="465" fill="#fef3c7" font-family="Georgia, serif" font-size="11" font-weight="bold">COMPANHIA · OCUPANTES RECENTES (3)</text>

  <rect x="22" y="473" width="316" height="32" rx="5" fill="#292524"/>
  <text x="28" y="487" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Arquiteto · Claude Code · Claude Opus 5.5 (high)</text>
  <text x="28" y="499" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8.5">modelo_no_log: Claude Opus 5.5 ✓ · subagentes: Haiku/Sonnet</text>

  <rect x="22" y="509" width="316" height="32" rx="5" fill="#292524"/>
  <text x="28" y="523" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Coordenador · Antigravity · Gemini 3.8 Flash (medium)</text>
  <text x="28" y="535" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8.5">modelo_no_log: Gemini 3.8 Flash ✓ · alta=Gemini 4 Argon</text>

