<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" width="360" height="660" role="img" aria-label="Esboço da Carta de Agente RPG (Frente e Verso)">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <rect width="360" height="660" fill="#0c0a09"/>

  <!-- Moldura Externa da Carta (Frente) -->
  <rect x="16" y="14" width="328" height="448" rx="14" fill="url(#cardBg)" stroke="url(#goldBorder)" stroke-width="2.5"/>
  <rect x="22" y="20" width="316" height="436" rx="10" fill="none" stroke="#78350f" stroke-width="1"/>

  <!-- Cabeçalho da Carta: Nome, Título e Estado -->
  <rect x="28" y="28" width="304" height="52" rx="8" fill="#292524" stroke="#b45309" stroke-width="1"/>
  <!-- Emblema de Navio/Compasso (Círdan) -->
  <circle cx="54" cy="54" r="18" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M46 58 Q54 42 62 58 Z" fill="#fde68a"/>
  <line x1="54" y1="40" x2="54" y2="62" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="49" fill="#fef3c7" font-family="Georgia, serif" font-size="13" font-weight="bold">CÍRDAN, O ARMADOR</text>
  <text x="80" y="67" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Arquiteto · Portos Cinzentos</text>
  <rect x="266" y="36" width="56" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="294" y="49" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">ATIVO</text>

  <!-- Ocupante Atual -->
  <rect x="28" y="88" width="304" height="36" rx="6" fill="#141210" stroke="#44403c"/>
  <text x="38" y="103" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">OCUPANTE ATUAL (DESDE 07/10/2026)</text>
  <text x="38" y="117" fill="#e7e5e4" font-family="monospace" font-size="9.5">Claude Code · Anthropic · Claude Opus 5.5 · high</text>

  <!-- Poderes (sc-papeis) -->
  <rect x="28" y="132" width="304" height="84" rx="6" fill="#292524" stroke="#57534e"/>
  <text x="38" y="149" fill="#fde68a" font-family="Georgia, serif" font-size="10.5" font-weight="bold">PODERES DO PAPEL</text>
  <text x="38" y="166" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5">• Planeja a arquitetura e escreve as ordens de etapa</text>
  <text x="38" y="182" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5">• Organiza o contexto ("Leia só") para poupar leitura</text>
  <text x="38" y="198" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="9.5">• Arbitra impasses técnicos e prepara cópia de revisão</text>

  <!-- Forças e Fraquezas (Curadoria de Odival) -->
  <rect x="28" y="224" width="304" height="86" rx="6" fill="#292524" stroke="#57534e"/>
  <text x="38" y="241" fill="#fde68a" font-family="Georgia, serif" font-size="10.5" font-weight="bold">FORÇAS &amp; FRAQUEZAS DO OCUPANTE</text>
  <text x="38" y="258" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">+ Força: síntese arquitetural profunda e recorte enxuto</text>
  <text x="38" y="274" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">+ Força: rigor na separação de fatias disjuntas</text>
  <text x="38" y="292" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9.5">− Fraqueza: cota sensível se varrer arquivos sem "Leia só"</text>

  <!-- Atributos Medidos (D10: só medidos; D08: sem dado = desconhecido) -->
  <rect x="28" y="318" width="304" height="88" rx="6" fill="#141210" stroke="#9333ea" stroke-width="1"/>
  <text x="38" y="335" fill="#f3e8ff" font-family="Georgia, serif" font-size="10.5" font-weight="bold">ATRIBUTOS MEDIDOS NO REGISTRO (D08 / D10)</text>
  <text x="38" y="354" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">Etapas em que atuou:</text>
  <text x="235" y="354" fill="#c084fc" font-family="monospace" font-size="9.5" font-weight="bold">desconhecido</text>
  <text x="38" y="370" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">Aceites de primeira:</text>
  <text x="235" y="370" fill="#c084fc" font-family="monospace" font-size="9.5" font-weight="bold">desconhecido</text>
  <text x="38" y="386" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">Passagens registradas:</text>
  <text x="235" y="386" fill="#c084fc" font-family="monospace" font-size="9.5" font-weight="bold">desconhecido</text>
  <text x="38" y="400" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8">(Na fase A, exibido como "desconhecido" até o campo entrar no painel/1)</text>

  <!-- Botão Virar Carta (Verso) -->
  <rect x="28" y="412" width="304" height="38" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="180" y="435" text-anchor="middle" fill="#fde68a" font-family="Georgia, serif" font-size="10.5" font-weight="bold">↻ VIRAR CARTA · VER HISTÓRICO DE OCUPANTES</text>

  <!-- Resumo do Verso da Carta (Abaixo) -->
  <rect x="16" y="474" width="328" height="170" rx="12" fill="#141210" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="28" y="496" fill="#fef3c7" font-family="Georgia, serif" font-size="11" font-weight="bold">VERSO DA CARTA · LINHAGEM &amp; ÚLTIMAS INTERAÇÕES</text>
  <text x="28" y="516" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">• 22/10 13:10Z · loja-exemplo / e3-carrinho</text>
  <text x="36" y="531" fill="#a7f3d0" font-family="monospace" font-size="8.5">Claude Opus 5.5 (high) · log confirmado ✓</text>
  <text x="28" y="551" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">• Passagem emitida: arquiteto → revisor (23/10 09:50Z)</text>
  <line x1="28" y1="566" x2="332" y2="566" stroke="#292524" stroke-width="1"/>
  <text x="28" y="586" fill="#fde68a" font-family="Georgia, serif" font-size="10.5" font-weight="bold">+ Carta Nova na Sociedade: Gwaihir, o Mensageiro</text>
  <text x="28" y="603" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9">Ocupante: Codex · OpenAI · GPT-6-Luna (low) → futuro modelo local</text>
  <text x="28" y="619" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8.5">Poderes: resumo ≤2 KB, triagem com persona em 2 camadas e tutoria</text>
</svg>
